; PlatformIO project for the Overby Industries miner/refinery pod firmware.
; Same layout convention as power-and-propulsion's platformio.ini.

[platformio]
src_dir = firmware/src
lib_dir = firmware/lib
test_dir = firmware/test

[env:uno]
platform = atmelavr
board = uno
framework = arduino

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino

[env:native]
; Host-native build of the FSM logic tests (`pio test -e native`) -- no
; hardware required.
platform = native
build_flags = -std=c++17
