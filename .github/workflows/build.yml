name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  firmware:
    name: firmware/ (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build Arduino Uno target
        run: pio run -e uno

      - name: Build ESP32 target
        run: pio run -e esp32

      - name: Run native FSM logic tests
        run: pio test -e native
